name: utility-site-prototype
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure Node unit and static checks (no npm install)
        run: npm run verify
      - name: Assert no active cloud deployment workflow
        run: |
          test ! -f .github/workflows/deploy.yml
          test -f dist/robots.txt
          grep -q 'Disallow: /' dist/robots.txt
